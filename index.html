<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺南市社區永續培力中心｜數位半年刊</title>
    
    <!-- 引入 Google Fonts 與備用字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 引入芫荽字體 (Tsung-Tseng Font) 網頁可用 CDN 或是透過 @font-face 引入開源專案網址 -->
    <style>
        /* 註冊開源芫荽字體 (Tsung-Tseng Font) 網路授權字型 */
        @font-face {
            font-family: 'TsungTseng';
            src: url('https://cdn.jsdelivr.net/gh/pulipulichen/Tsung-Tseng-Font@master/webfont/TsungTsengFont.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/gh/pulipulichen/Tsung-Tseng-Font@master/webfont/TsungTsengFont.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #FBF8F3; /* 溫潤大地米色背景 */
            --card-bg: #FFFFFF;
            --text-main: #2C2A29; /* 柔和深咖啡灰，保護眼睛減少對比刺眼 */
            --primary: #8C6D53;  /* 大地暖褐色 */
            --accent: #C28E62;   /* 暖橘棕點綴色 */
            --border-color: #E6E0D5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* 優先使用芫荽字體，若無則依序使用 Noto Serif TC 與系統襯線字體 */
            font-family: 'TsungTseng', 'Noto Serif TC', serif, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
            font-size: 19px; /* 微調放大，確保長輩與夥伴閱讀更清晰舒服 */
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* 封面樣式 */
        header.magazine-cover {
            background: linear-gradient(135deg, #8C6D53 0%, #5A4434 100%);
            color: #FFF;
            padding: 80px 40px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        header.magazine-cover h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
            font-weight: 700;
        }

        header.magazine-cover p.subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* 文章區塊 */
        section.article-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        h2.section-title {
            font-size: 1.8rem;
            color: var(--primary);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        p {
            margin-bottom: 20px;
            text-align: justify;
        }

        /* 響應式圖片網格 */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .image-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .image-card p.caption {
            font-size: 0.95rem;
            color: #666;
            text-align: center;
            margin-top: 8px;
        }

        /* 頁尾 */
        footer {
            text-align: center;
            padding: 40px 0;
            color: #777;
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: 50px;
        }

        /* 列印與 PDF 匯出優化樣式 */
        @media print {
            body {
                background-color: #FFFFFF;
                font-size: 14pt;
            }
            .container {
                max-width: 100%;
                padding: 0;
            }
            header.magazine-cover {
                background: #8C6D53 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                page-break-after: always;
            }
            section.article-section {
                border: none;
                box-shadow: none;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 封面 -->
        <header class="magazine-cover">
            <h1>臺南市社區永續培力中心</h1>
            <p class="subtitle">115年度半年度成果專刊・在地扎根與社造同行</p>
        </header>

        <!-- 單元一：卷首語 -->
        <section class="article-section">
            <h2 class="section-title">【卷首語】點亮溪北的社造微光</h2>
            <p>這半年來，我們走訪了學甲、後壁、六甲、下營等各個社區。看見許多長者與青年共同投入在地創生，從福利社區化到組織治理，每一步都凝聚著居民對這塊土地的深厚情感。</p>
            <p>本期半年刊特別整理了各區的實踐精華與創新成果，期望透過數位平台的分享，讓更多夥伴看見臺南社造的多元面貌與永續可能。</p>
        </section>

        <!-- 單元二：焦點特輯與活動花絮 -->
        <section class="article-section">
            <h2 class="section-title">【焦點特輯】金卓越社區選拔與培力實錄</h2>
            <p>在輔導過程中，
